<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Carte de voeux - POC</title>

    <link rel="stylesheet" href="./css/main.css" />
  </head>

  <body>
    <main>
      <section class="scroll">
        <div class="story">
          <div class="scene">
            <div class="text">
              <p id="text">Tout commence par une idée.</p>
            </div>

            <div class="composition">
              <div class="point"></div>

              <div class="line"></div>

              <div class="element circle blue element1"></div>
              <div class="element circle yellow element2"></div>
              <div class="element circle green element3"></div>

              <!-- Remplace ces images par tes propres images -->
              <img class="photo photo1" src="images/image1.png" />
              <img class="photo photo2" src="images/image2.png" />
            </div>

            <div class="final">
              <h1>Continuons à faire naître les idées.</h1>
              <p>Belle année 2026.</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="./js/script.js"></script>
  </body>
</html>
