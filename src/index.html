<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>POC</title>

    <link rel="stylesheet" href="./css/main.css" />
  </head>

  <body>
    <main>
      <section class="scene">
        <h1 class="text">Tout commence par une idée.</h1>
        <div class="design">
          <!-- Ligne courbée -->

          <svg class="line" viewBox="0 0 1000 300">
            <path d="M 0 150 C 250 20, 600 280, 1000 70"></path>
          </svg>

          <!-- Premier point -->

          <div class="Group">
            <div class="dot dot1"></div>

            <!-- Autres points -->

            <div class="dot dot2"></div>

            <div class="dot dot3"></div>

            <div class="dot dot4"></div>

            <div class="dot dot5"></div>

            <div class="dot dot6"></div>

            <div class="dot dot7"></div>

            <div class="dot dot8"></div>

            <!-- Lignes entre les points -->

            <!--
            <svg
              class="connections"
              viewBox="0 0 1000 600"
            >

              <line
                class="connection connection1"
                x1="650"
                y1="300"
                x2="750"
                y2="230"
              ></line>

              <line
                class="connection connection2"
                x1="750"
                y1="230"
                x2="800"
                y2="240"
              ></line>

              <line
                class="connection connection3"
                x1="650"
                y1="300"
                x2="580"
                y2="301"
              ></line>

            </svg>
            -->

            <!-- Image -->

            <img class="feuille" src="./images/feuille.png" alt="feuille" />

            <div class="illustration">
              <img
                src="./images/image-paysage1.png"
                class="paysage paysage1"
                alt=""
              />

              <img
                src="./images/image-paysage2.png"
                class="paysage paysage2"
                alt=""
              />

              <img
                src="./images/image-paysage3.png"
                class="paysage paysage3"
                alt=""
              />

              <img
                src="./images/image-paysage4.png"
                class="paysage paysage4"
                alt=""
              />
            </div>
          </div>
        </div>
      </section>

      <section class="card-end">
        <div class="card-end-content">
          <img src="./images/sun.png" class="card-end-image sun" alt="" />
          <img src="./images/water.png" class="card-end-image water" alt="" />

          <img
            src="./images/blue-mountain.png"
            class="card-end-image blue-mountain"
            alt=""
          />
          <img src="./images/bridge.png" class="card-end-image bridge" alt="" />

          <img
            src="./images/right-mountain.png"
            class="card-end-image right-mountain"
            alt=""
          />

          <img
            src="./images/left-mountain.png"
            class="card-end-image left-mountain"
            alt=""
          />
          <img
            src="./images/tree-right.png"
            class="card-end-image right-tree"
            alt=""
          />

          <img
            src="./images/tree-left.png"
            class="card-end-image left-tree"
            alt=""
          />
          <img class="bird" src="./images/bird.gif" alt="" />

          <!-- TEXTE -->

          <div class="card-end-text">
            <h2>Bonne année 2027.</h2>

            <p>
              Nous vous souhaitons une année pleine d'idées, de projets et de
              nouvelles possibilités.
            </p>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./js/script.js"></script>
  </body>
</html>
